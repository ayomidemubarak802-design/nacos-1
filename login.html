<!DOCTYPE html>
<html>

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Nacos login page</title>
   <link rel="stylesheet" href="login.css"/>
</head>

<body>
   <div class="login-container">
      <div class="Nacos-logo">
         <img src="nacos logo.png" alt="nacos-logo" />
      </div>
      
      <form>
         <h1>Login</h1>
         <p id="comment">Access your NACOS portal account</p>
         <label for="Matric No/Email">Matric No/Email:</label>
         <input type="text" id="username" required/>
         <label for="Password">Password:</label>
         <div class="password-box">
            <input type="password" name="psw" id="psw" required/><span id="togglepassword">🔒</span>
         </div>
         <button class="btn" type="submit">Login</button>
      </form>
      <p><a href="#">Forget your password?</a></p>
      <p id="register">don't have an account?<a href="#">Register here</a></p>
      
   </div>
   
   <script>
      const password = document.getElementById('psw')
      const toggle = document. getElementById('togglepassword')
      toggle.addEventListener('click', ()=>{
         if (password.type==='password'){
            password.type='text';
            toggle.textContent='🔓'
         }else{
            password.type='password';
            toggle.textContent='🔒';
         }
      });
      
      
   </script>
</body>

</html>
