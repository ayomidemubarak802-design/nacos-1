<!DOCTYPE html>
<html>
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Payment Tracker</title>
   <style>
      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: 'Times New Roman', Times, serif;
      }
      body {
         background: #1e293b;
         display: flex;
         justify-content: center;
         padding: 30px;
         color: white;
      }
      .container {
         background: #0f172a;
         border-radius: 15px;
         width: 100%;
         max-width: 600px;
         padding: 20px;
         box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      }
      h1 {
         text-align: center;
         margin-bottom: 20px;
         color: #22c55e;
      }
      table {
         width: 100%;
         border-collapse: collapse;
      }
      th, td {
         padding: 12px;
         text-align: left;
         border-bottom: 1px solid #334155;
      }
      th {
         background: #2563eb;
         color: white;
      }
      tr:hover {
         background: #1e293b;
      }
      .amount {
         text-align: right;
         font-weight: bold;
      }
      .total-row {
         font-size: 18px;
         background: #065f46;
      }
      .paid {
         text-align: center;
      }
      input[type="checkbox"] {
         width: 18px;
         height: 18px;
         accent-color: #22c55e;
      }
   </style>
</head>
<body>
   <div class="container">
      <h1>Payment Tracker</h1>
      <table>
         <thead>
            <tr>
               <th>S/N</th>
               <th>Name</th>
               <th class="amount">Amount</th>
               <th class="paid">Paid</th>
            </tr>
         </thead>
         <tbody>
            <tr>
               <td>1</td>
               <td>Grace</td>
               <td class="amount">₦10,000</td>
               <td class="paid"><input type="checkbox"></td>
            </tr>
            <tr>
               <td>2</td>
               <td>ADEDAMOLA ELIZABETH ADESIPE</td>
               <td class="amount">₦13,700</td>
               <td class="paid"><input type="checkbox"></td>
            </tr>
            <tr>
               <td>3</td>
               <td>Adeosun Mubarak</td>
               <td class="amount">₦15,000</td>
               <td class="paid"><input type="checkbox"></td>
            </tr>
            <tr>
               <td>4</td>
               <td>Aduragbemi</td>
               <td class="amount">₦10,000</td>
               <td class="paid"><input type="checkbox"></td>
            </tr>
            <tr>
               <td>5</td>
               <td>Victoria</td>
               <td class="amount">₦10,000</td>
               <td class="paid"><input type="checkbox"></td>
            </tr>
            <tr>
               <td>6</td>
               <td>Samson</td>
               <td class="amount">₦10,000</td>
               <td class="paid"><input type="checkbox"></td>
            </tr>
            <tr>
               <td>7</td>
               <td>Adenuga</td>
               <td class="amount">₦13,700</td>
               <td class="paid"><input type="checkbox"></td>
            </tr>
            <tr>
               <td>8</td>
               <td>Moyinoluwa</td>
               <td class="amount">₦15,000</td>
               <td class="paid"><input type="checkbox"></td>
            </tr>
            <tr>
               <td>9</td>
               <td>Adeniran Sunday</td>
               <td class="amount">₦13,700</td>
               <td class="paid"><input type="checkbox"></td>
            </tr>
            <tr class="total-row">
               <td colspan="2"><b>TOTAL</b></td>
               <td class="amount"><b>₦111,100</b></td>
               <td></td>
            </tr>
         </tbody>
      </table>
   </div>
</body>
</html>
